<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | Solbin-X</title>
    <link rel="icon" type="image/svg+xml" href="Imagenes/FavIcon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --teal: #37a8a8;
            --teal-dark: #2d8a8a;
            --teal-light: #4fc4c4;
            --gold: #e5b73a;
            --gold-dark: #d4a52a;
            --off-white: #f8f7fc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background Effects */
        .bg-wrapper {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e293b 100%);
            overflow: hidden;
        }

        /* Circuit Grid - Subtle */
        .circuit-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(55, 168, 168, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(55, 168, 168, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Circuit Nodes */
        .circuit-nodes {
            position: absolute;
            inset: 0;
        }

        .circuit-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--teal);
            border-radius: 50%;
            animation: node-pulse 3s ease-in-out infinite;
        }

        .circuit-node:nth-child(1) { top: 15%; left: 20%; }
        .circuit-node:nth-child(2) { top: 40%; right: 25%; background: var(--gold); }
        .circuit-node:nth-child(3) { top: 75%; left: 35%; }
        .circuit-node:nth-child(4) { top: 25%; left: 75%; background: var(--gold); }
        .circuit-node:nth-child(5) { top: 85%; right: 15%; }
        .circuit-node:nth-child(6) { top: 60%; left: 10%; background: var(--gold); }

        @keyframes node-pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Data Flow Particles */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(55, 168, 168, 0.6);
            border-radius: 50%;
            animation: particle-float 15s linear infinite;
        }

        .particle:nth-child(1) { left: 15%; animation-duration: 18s; }
        .particle:nth-child(2) { left: 35%; animation-delay: -3s; animation-duration: 20s; background: rgba(229, 183, 58, 0.6); }
        .particle:nth-child(3) { left: 55%; animation-delay: -6s; animation-duration: 16s; }
        .particle:nth-child(4) { left: 75%; animation-delay: -9s; animation-duration: 22s; background: rgba(229, 183, 58, 0.6); }
        .particle:nth-child(5) { left: 90%; animation-delay: -12s; animation-duration: 19s; }

        @keyframes particle-float {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* Abstract Shapes - Static */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(55, 168, 168, 0.1) 0%, transparent 70%);
            top: -100px;
            right: -50px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(229, 183, 58, 0.08) 0%, transparent 70%);
            bottom: -50px;
            left: -50px;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(55, 168, 168, 0.06) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Gradient Orbs - Static */
        .orb {
            position: absolute;
            border-radius: 50%;
        }

        .orb-1 {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(55, 168, 168, 0.1) 0%, transparent 70%);
            top: 20%;
            right: 15%;
        }

        .orb-2 {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(229, 183, 58, 0.08) 0%, transparent 70%);
            bottom: 30%;
            left: 10%;
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* Main Card - Clean Design */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            animation: card-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 
                0 30px 60px -15px rgba(55, 168, 168, 0.15),
                0 20px 40px -20px rgba(55, 168, 168, 0.1);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card Header */
        .card-header {
            position: relative;
            padding: 0;
            text-align: center;
            background: linear-gradient(180deg, rgba(55, 168, 168, 0.05) 0%, transparent 100%);
        }

        /* Header Gradient Bar */
        .header-gradient {
            position: relative;
            padding: 24px 32px 18px;
            background: var(--teal);
            overflow: hidden;
        }

        .header-gradient::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
        }

        /* Logo */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .logo-wrapper:hover .logo-text {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Title */
        .title {
            position: relative;
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.02em;
        }

        /* Form */
        .form-wrapper {
            position: relative;
            padding: 20px 32px 28px;
            background: #ffffff;
        }

        /* Form Background Pattern */
        .form-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(55, 168, 168, 0.15), transparent);
        }

        /* Input Groups */
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px 12px 44px;
            background: #ffffff;
            border: 2px solid rgba(55, 168, 168, 0.2);
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .input-field:focus {
            border-color: var(--teal);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(55, 168, 168, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #37a8a8;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field:focus ~ .input-icon {
            color: #2d8a8a;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--teal);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--teal-dark);
            background: rgba(55, 168, 168, 0.1);
        }

        /* Error Message */
        .error-alert {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(239, 68, 68, 0.04));
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 12px;
            margin-bottom: 14px;
            animation: shake 0.5s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .error-alert i {
            color: #dc2626;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .error-alert span {
            color: #b91c1c;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .error-alert.hidden {
            display: none;
        }

        /* Submit Button - Premium */
        .submit-btn {
            position: relative;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 50%, var(--teal) 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 
                0 4px 15px rgba(55, 168, 168, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            margin-top: 6px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 50%, var(--teal-dark) 100%);
            background-size: 200% 200%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.8s ease, height 0.8s ease;
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 30px rgba(55, 168, 168, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.15) inset,
                0 0 60px rgba(55, 168, 168, 0.2);
            background-position: 100% 100%;
        }

        .submit-btn:hover::after {
            width: 500px;
            height: 500px;
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 15px rgba(55, 168, 168, 0.3);
        }

        .submit-btn:disabled::before {
            opacity: 1;
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .submit-btn:disabled .btn-content:not(.loading) {
            display: none;
        }

        .submit-btn:disabled .btn-spinner {
            display: inline-block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            position: relative;
            margin: 20px 0;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(55, 168, 168, 0.2), transparent);
        }

        .divider span {
            position: relative;
            display: inline-block;
            padding: 0 20px;
            background: #ffffff;
            color: var(--teal);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Back Link */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: #ffffff;
            border: 1.5px solid rgba(55, 168, 168, 0.3);
            border-radius: 14px;
            color: var(--teal);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(55, 168, 168, 0.08);
        }

        .back-link:hover {
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
            border-color: var(--teal-dark);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(55, 168, 168, 0.25);
        }

        .back-link i {
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .back-link:hover i {
            transform: translateX(-4px);
        }

        /* Security Badge */
        .security-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(55, 168, 168, 0.2);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .security-dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, var(--teal), var(--teal-light));
            border-radius: 50%;
            position: relative;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .security-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid rgba(55, 168, 168, 0.3);
            animation: pulse-ring 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(55, 168, 168, 0.4); }
            50% { box-shadow: 0 0 0 6px rgba(55, 168, 168, 0); }
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0; }
        }

        .security-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Feature Icons Row */
        .features-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #e5b73a;
            border-radius: 10px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #1e293b;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .feature-item i {
            color: #1e293b;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header-gradient {
                padding: 24px 20px 16px;
            }

            .logo-text {
                font-size: 1.5rem;
            }

            .title {
                font-size: 0.9rem;
            }

            .form-wrapper {
                padding: 20px 20px 24px;
            }

            .features-row {
                flex-wrap: wrap;
                gap: 12px;
            }

            .security-badge {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Background -->
    <div class="bg-wrapper">
        <div class="circuit-grid"></div>
        <div class="circuit-nodes">
            <div class="circuit-node"></div>
            <div class="circuit-node"></div>
            <div class="circuit-node"></div>
            <div class="circuit-node"></div>
            <div class="circuit-node"></div>
            <div class="circuit-node"></div>
        </div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Security Badge -->
    <div class="security-badge">
        <div class="security-dot"></div>
        <span class="security-text">Seguro</span>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Card Header -->
            <div class="card-header">
                <!-- Header Gradient Background -->
                <div class="header-gradient">
                    <!-- Logo -->
                    <div class="logo-wrapper">
                        <span class="logo-text">SOLBIN-X</span>
                    </div>
                    
                    <!-- Title -->
                    <h1 class="title">Panel de Administración</h1>
                </div>
            </div>

            <!-- Features Row -->
            <div class="features-row">
                <div class="feature-item">
                    <i class="fas fa-shield-halved"></i>
                    <span>SSL Seguro</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-lock"></i>
                    <span>Encriptado</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-user-shield"></i>
                    <span>Protegido</span>
                </div>
            </div>

            <!-- Form -->
            <div class="form-wrapper">
                <form id="loginForm">
                    <!-- Email -->
                    <div class="input-group">
                        <label class="input-label">
                            <i class="fas fa-envelope"></i>
                            Correo Electrónico
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-at input-icon"></i>
                            <input 
                                type="email" 
                                id="email" 
                                class="input-field" 
                                placeholder="admin@solbinx.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label class="input-label">
                            <i class="fas fa-lock"></i>
                            Contraseña
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-key input-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="input-field" 
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Error Alert -->
                    <div id="errorAlert" class="error-alert hidden">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-content">
                            <i class="fas fa-right-to-bracket"></i>
                            Iniciar Sesión
                        </span>
                        <span class="btn-content loading">
                            <i class="fas fa-circle-notch btn-spinner"></i>
                            Verificando...
                        </span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Back Link -->
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Volver a la tienda
                </a>
            </div>
        </div>
    </div>

    <script>
        // Password Toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.innerHTML = type === 'password' 
                ? '<i class="fas fa-eye"></i>' 
                : '<i class="fas fa-eye-slash"></i>';
        });

        // Error Display
        const errorAlert = document.getElementById('errorAlert');
        const errorText = document.getElementById('errorText');

        function showError(message) {
            errorText.textContent = message;
            errorAlert.classList.remove('hidden');
            setTimeout(() => {
                errorAlert.classList.add('hidden');
            }, 6000);
        }

        function hideError() {
            errorAlert.classList.add('hidden');
        }

        // Session Keys
        const SESSION_KEYS = [
            'admin_session_start',
            'admin_last_activity',
            'admin_session_token',
            'admin_tab_id',
            'admin_active_tab',
            'admin_tab_heartbeat'
        ];

        // Check Existing Session
        async function checkExistingSession() {
            const client = window.supabaseClient || window.supabase;
            const heartbeatData = localStorage.getItem('admin_tab_heartbeat');
            
            if (heartbeatData) {
                try {
                    const heartbeat = JSON.parse(heartbeatData);
                    const heartbeatAge = Date.now() - heartbeat.timestamp;
                    
                    if (heartbeatAge > 30000) {
                        console.log('[Login] Limpiando sesión de pestaña inactiva');
                        SESSION_KEYS.forEach(key => localStorage.removeItem(key));
                        await client.auth.signOut();
                        return;
                    }
                } catch (e) {}
            }
            
            const hasOurSession = localStorage.getItem('admin_session_start');
            
            try {
                const { data: { session } } = await client.auth.getSession();
                
                if (session && !hasOurSession) {
                    await client.auth.signOut();
                    console.log('[Login] Sesión residual limpiada');
                    return;
                }
                
                if (session && hasOurSession) {
                    const sessionStart = parseInt(localStorage.getItem('admin_session_start'), 10);
                    const MAX_SESSION = 8 * 60 * 60 * 1000;
                    
                    if (Date.now() - sessionStart > MAX_SESSION) {
                        await client.auth.signOut();
                        SESSION_KEYS.forEach(key => localStorage.removeItem(key));
                        console.log('[Login] Sesión admin expirada');
                        return;
                    }
                    
                    const heartbeatData = localStorage.getItem('admin_tab_heartbeat');
                    if (heartbeatData) {
                        try {
                            const heartbeat = JSON.parse(heartbeatData);
                            const heartbeatAge = Date.now() - heartbeat.timestamp;
                            
                            if (heartbeatAge < 10000) {
                                await client.auth.signOut();
                                SESSION_KEYS.forEach(key => localStorage.removeItem(key));
                                Swal.fire({
                                    title: 'Sesión Activa',
                                    text: 'Ya tienes una sesión abierta en otra pestaña.',
                                    icon: 'info',
                                    confirmButtonText: 'Entendido',
                                    confirmButtonColor: '#37a8a8'
                                });
                                return;
                            }
                        } catch (e) {}
                    }
                    
                    window.location.href = 'admin.html';
                }
            } catch (err) {
                console.error('[Login] Error verificando sesión:', err);
            }
        }
        checkExistingSession();

        // Login Attempts
        let loginAttempts = 0;
        let lastAttemptTime = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 60000;

        // Form Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const now = Date.now();

            if (loginAttempts >= MAX_ATTEMPTS && (now - lastAttemptTime) < LOCKOUT_TIME) {
                const remaining = Math.ceil((LOCKOUT_TIME - (now - lastAttemptTime)) / 1000);
                Swal.fire({
                    title: 'Demasiados Intentos',
                    text: `Por favor espera ${remaining} segundos antes de intentar de nuevo.`,
                    icon: 'warning',
                    confirmButtonColor: '#37a8a8'
                });
                return;
            }

            if ((now - lastAttemptTime) >= LOCKOUT_TIME) {
                loginAttempts = 0;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Por favor ingresa un correo electrónico válido.');
                return;
            }

            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            try {
                submitBtn.disabled = true;

                const client = window.supabaseClient || window.supabase;
                const { error } = await client.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                loginAttempts = 0;
                SESSION_KEYS.forEach(key => localStorage.removeItem(key));
                
                // Generar ID de instancia del navegador (si no existe)
                let browserInstanceId = sessionStorage.getItem('browser_instance_id');
                if (!browserInstanceId) {
                    browserInstanceId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
                    sessionStorage.setItem('browser_instance_id', browserInstanceId);
                }
                
                // Establecer marca de sesion admin
                localStorage.setItem('admin_session_start', Date.now().toString());
                localStorage.setItem('admin_last_activity', Date.now().toString());
                localStorage.setItem('admin_tab_id', Date.now().toString() + Math.random().toString(36).substr(2, 9));
                localStorage.setItem('admin_browser_instance', browserInstanceId);

                window.location.href = 'admin.html';

            } catch (err) {
                loginAttempts++;
                lastAttemptTime = now;

                let errorMsg = 'Credenciales incorrectas. Intenta de nuevo.';
                
                if (err.message && err.message.includes('Invalid login credentials')) {
                    errorMsg = 'Correo o contraseña incorrectos.';
                } else if (err.message && err.message.includes('Email not confirmed')) {
                    errorMsg = 'Por favor confirma tu correo electrónico.';
                }
                
                showError(errorMsg);
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
